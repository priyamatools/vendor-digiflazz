name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.22"
  BINARY_NAME: vendor-digiflazz

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - platform: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - platform: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
            archive: zip
          - platform: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - platform: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          OUT="dist/${{ env.BINARY_NAME }}-${VERSION}-${{ matrix.platform }}${{ matrix.ext }}"
          mkdir -p dist/package/migrations
          cp -r migrations/* dist/package/migrations/
          go build -ldflags="-s -w" -o "dist/package/${{ env.BINARY_NAME }}${{ matrix.ext }}" ./cmd/server
          echo "${VERSION}" > dist/package/VERSION.txt

          PKG="dist/${{ env.BINARY_NAME }}-${VERSION}-${{ matrix.platform }}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist/package && zip -r "../${{ env.BINARY_NAME }}-${VERSION}-${{ matrix.platform }}.zip" .)
          else
            tar -czf "${PKG}.tar.gz" -C dist/package .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ steps.version.outputs.tag }}-${{ matrix.platform }}
          path: dist/${{ env.BINARY_NAME }}-${{ steps.version.outputs.tag }}-${{ matrix.platform }}.*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

services:
  api:
    image: etan1997/vendor-digiflazz:latest
    env_file: .env
    environment:
      # Di dalam Compose, host DB = nama service (bukan localhost)
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/addon_digiflazz?sslmode=disable
      HTTP_PORT: "8080"
    ports:
      - "7118:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: addon_digiflazz
    # Tanpa `ports:` — Postgres hanya di jaringan internal Compose (api → postgres:5432)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d addon_digiflazz"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
